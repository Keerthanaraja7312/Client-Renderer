name: Build and Deploy Client Renderer

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: client-renderer
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Docker Username
        run: echo "DOCKERHUB_USER=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Check API URL secret is set
        env:
          API_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERROR: secret VITE_API_BASE_URL is empty or missing"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_DATASTORE_API_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_API_BASE=${{ secrets.VITE_API_BASE_URL }}
            VITE_REQUIRE_LOGIN=true
            VITE_DEFAULT_PAGE=

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            IMAGE=${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            docker pull "$IMAGE"
            docker rm -f client-renderer || true
            docker run -d \
              --name client-renderer \
              -p 3002:80 \
              --restart unless-stopped \
              "$IMAGE"

            docker image prune -f